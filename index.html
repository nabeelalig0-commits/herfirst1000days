const navigate = (page, hash) => {
  if (!pages[page]) page = 'home';
  window.scrollTo(0, 0);
  const mm = document.getElementById('mobile-menu');
  if (mm) mm.classList.add('hidden');
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));

  if (al) al.classList.add('active');

  if (hash) setTimeout(() => {

    if (el) window.scrollTo({ top: el.offsetTop - 80, behavior: 'smooth' });

  setTimeout(initCounters, 50);
  try { history.pushState({page}, '', '#' + page); } catch(e) {}
};

const initCounters = () => {
  const counters = document.querySelectorAll('[data-target]');
  if (!counters.length) return;
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting && !e.target.dataset.animated) {
        e.target.dataset.animated = '1';
        const target = parseInt(e.target.dataset.target);
        const suffix = e.target.dataset.suffix || '';
        const duration = 2000;
        const start = performance.now();
        const step = (now) => {
          const p = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          e.target.textContent = Math.floor(eased * target).toLocaleString('en-IN') + suffix;
          if (p < 1) requestAnimationFrame(step);
          else e.target.textContent = target.toLocaleString('en-IN') + suffix;
        };
        requestAnimationFrame(step);
      }
    });
  }, { threshold: 0.3 });
  counters.forEach(c => obs.observe(c));
};

// ============== CALCULATOR FUNCTIONS ==============
const calcBMI = () => {
  const h = num('bmiH'), w = num('bmiW');
  if (isNaN(h) || h < 50 || h > 250) return showError('bmiR', 'Enter valid height (50-250 cm)');
  if (isNaN(w) || w < 10 || w > 300) return showError('bmiR', 'Enter valid weight (10-300 kg)');
  const bmi = (w / Math.pow(h/100, 2)).toFixed(1);
  let cat='',col='#2BA3A0',advice='';
  if (bmi<18.5){cat='Underweight';col='#2196F3';advice='Increase nutrient-dense foods.';}
  else if (bmi<25){cat='Normal';col='#2BA3A0';advice='Great! Maintain this balance.';}
  else if (bmi<30){cat='Overweight';col='#F57F17';advice='Consider portion control & activity.';}
  else{cat='Obese';col='#E91E63';advice='Consult a healthcare provider.';}
  showResult('bmiR',`<div class="tool-result"><div class="big" style="color:${col}">${bmi}</div><div class="label" style="font-weight:700;color:${col}">${cat}</div><div class="detail">${advice}</div><div class="detail" style="margin-top:6px"><strong>Healthy BMI:</strong> 18.5 – 24.9</div></div>`);
};

const calcEDD = () => {
  const v = document.getElementById('lmp')?.value;
  if (!v) return showError('eddR', 'Please select a date');
  const lmp = new Date(v);
  if (isNaN(lmp.getTime())) return showError('eddR', 'Invalid date');
  const edd = new Date(lmp); edd.setDate(edd.getDate()+280);
  const diff = Math.floor((new Date()-lmp)/(1000*60*60*24));
  if (diff < 0) return showError('eddR', 'LMP cannot be in future');
  const wk = Math.floor(diff/7), days = diff%7;
  const trim = wk<=13?'1st Trimester':wk<=27?'2nd Trimester':'3rd Trimester';
  const daysToEDD = Math.max(0, Math.floor((edd-new Date())/(1000*60*60*24)));
  showResult('eddR',`<div class="tool-result"><div class="big">${edd.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div><div class="label" style="font-weight:700">Estimated Due Date</div><div class="detail"><strong>Current gestational age:</strong> ${wk} weeks, ${days} days (${trim})</div><div class="detail"><strong>${daysToEDD} days</strong> remaining</div></div>`);
};

const calcWater = () => {
  const w = num('wW'), a = document.getElementById('wA')?.value, c = parseInt(document.getElementById('wC')?.value) || 0;
  if (isNaN(w) || w < 20 || w > 200) return showError('wR', 'Enter valid weight (20-200 kg)');
  let ml = w * 35 + c;
  if (a === 'Moderate') ml += 300;
  else if (a === 'Active') ml += 600;
  const glasses = Math.round(ml/250);
  const extra = c ? `${c}ml condition + ` : '';
  showResult('wR',`<div class="tool-result"><div class="big">${glasses}</div><div class="label">glasses (250ml each)</div><div class="detail"><strong>Total:</strong> ${Math.round(ml)} ml per day</div><div class="detail" style="font-size:.75rem"><em>${extra}35ml per kg base</em></div></div>`);
};

const calcPCOS = () => {
  let s = 0;
  for (let i = 1; i <= 5; i++) {
    const el = document.getElementById('p'+i);
    if (el) s += parseInt(el.value) || 0;
  }
  let r='',col='#2BA3A0',rec='';
  if (s<=1){r='Low Risk';col='#2BA3A0';rec='Maintain healthy lifestyle.';}
  else if (s<=3){r='Moderate Risk';col='#F57F17';rec='Consider clinical evaluation.';}
  else{r='High Risk';col='#E91E63';rec='Consult a gynaecologist for diagnosis.';}
  showResult('pR',`<div class="tool-result"><div class="big" style="color:${col}">${s}/5</div><div class="label" style="font-weight:700;color:${col}">${r}</div><div class="detail" style="margin-top:10px;background:#FFF8F3;padding:10px;border-radius:8px"><strong>${rec}</strong></div></div>`);
};

const calcPreg = () => {
  const pre = num('pW'), cur = num('cW'), wk = num('wk');
  if (isNaN(pre) || pre < 30 || pre > 200) return showError('prR', 'Enter valid pre-pregnancy weight');
  if (isNaN(cur) || cur < 30 || cur > 200) return showError('prR', 'Enter valid current weight');
  if (isNaN(wk) || wk < 1 || wk > 42) return showError('prR', 'Enter valid week (1-42)');
  const gain = cur - pre;
  const lowerExpected = wk <= 13 ? 0.5 : 2 + (wk - 14) * 0.4;
  const upperExpected = wk <= 13 ? 2 : 2 + (wk - 14) * 0.5;
  let status='',col='#2BA3A0',msg='';
  if (gain < lowerExpected - 1) { status='Below Range';col='#2196F3';msg='⚠️ Focus on nutrient-dense foods.'; }
  else if (gain > upperExpected + 2) { status='Above Range';col='#F57F17';msg='⚠️ Consult your doctor.'; }
  else { status='On Track';col='#2BA3A0';msg='✅ Healthy weight progression!'; }
  showResult('prR',`<div class="tool-result"><div class="big" style="color:${col}">+${gain.toFixed(1)} kg</div><div class="label" style="font-weight:700;color:${col}">${status}</div><div class="detail"><strong>Healthy range at week ${wk}:</strong> ${lowerExpected.toFixed(1)}-${upperExpected.toFixed(1)} kg</div><div class="detail" style="margin-top:6px">${msg}</div><div class="detail" style="font-size:.75rem"><strong>Total recommended:</strong> 11.5-16 kg (normal BMI)</div></div>`);
};

const calcGrowth = () => {
  const age = num('gA'), gender = document.getElementById('gG')?.value, weight = num('gW'), height = num('gH');
  if (isNaN(age) || age < 0 || age > 60) return showError('gR', 'Enter age (0-60 months)');
  if (isNaN(weight) || weight < 1 || weight > 50) return showError('gR', 'Enter valid weight (1-50 kg)');
  if (isNaN(height) || height < 40 || height > 150) return showError('gR', 'Enter valid height (40-150 cm)');
  const WHO_W = {boy:{0:3.3,6:7.9,12:9.6,24:12.2,36:14.3,48:16.3,60:18.3},girl:{0:3.2,6:7.3,12:9.0,24:11.5,36:13.5,48:15.7,60:18.2}};
  const WHO_H = {boy:{0:49.9,6:67.6,12:75.7,24:87.8,36:96.1,48:103.3,60:110.0},girl:{0:49.1,6:65.7,12:74.0,24:86.4,36:95.1,48:102.7,60:109.4}};
  const interp = (t, target) => {
    const ages = Object.keys(t).map(Number).sort((a,b)=>a-b);
    if (target <= ages[0]) return t[ages[0]];
    if (target >= ages[ages.length-1]) return t[ages[ages.length-1]];
    for (let i=0;i<ages.length-1;i++) {
      if (target >= ages[i] && target <= ages[i+1]) {
        const r = (target-ages[i])/(ages[i+1]-ages[i]);
        return t[ages[i]] + r*(t[ages[i+1]]-t[ages[i]]);
      }
    }
    return t[ages[0]];
  };
  const wMed = interp(WHO_W[gender], age);
  const wRatio = weight/wMed;
  let status='',col='#2BA3A0',advice='✅ Weight is within healthy range for age.';
  if (wRatio<0.7) {status='Severely Underweight';col='#E91E63';advice='⚠️ Consult pediatrician immediately.';}
  else if (wRatio<0.85) {status='Underweight';col='#F57F17';advice='⚠️ Nutritional intervention recommended.';}
  else if (wRatio>1.2) {status='Possible Overweight';col='#F57F17';advice='⚠️ Consult doctor for assessment.';}
  showResult('gR',`<div class="tool-result"><div class="big" style="color:${col}">${weight} kg</div><div class="label" style="font-weight:700;color:${col}">${status}</div><div class="detail"><strong>WHO Median:</strong> ${wMed.toFixed(1)} kg at ${age} months</div><div class="detail"><strong>Height:</strong> ${height} cm</div><div class="detail" style="margin-top:8px;background:#FFF8F3;padding:10px;border-radius:8px;font-size:.85rem">${advice}</div></div>`);
};

const calcNutr = () => {
  const vals = ['n1','n2','n3','n4','n5'].map(id => num(id));
  if (vals.some(isNaN)) return showError('nR', 'Fill all fields with valid numbers');
  const score = Math.min(vals[0],5) + Math.min(vals[1],3) + Math.min(vals[2],2) + Math.min(vals[3],2) + Math.min(vals[4],8);
  const total = 20;
  const pct = Math.round((score/total)*100);
  let grade='',col='#2BA3A0',msg='',tips='';
  if (pct>=85) {grade='Excellent';col='#2BA3A0';msg='Outstanding!';tips='Maintain this pattern.';}
  else if (pct>=65) {grade='Good';col='#2196F3';msg='Good habits!';tips='Add 1-2 more servings of fruits/vegetables.';}
  else if (pct>=45) {grade='Needs Improvement';col='#F57F17';msg='Several areas need attention.';tips='Focus on more vegetables and water.';}
  else {grade='Poor';col='#E91E63';msg='Major improvement needed.';tips='Consult a nutritionist.';}
  showResult('nR',`<div class="tool-result"><div class="big" style="color:${col}">${grade}</div><div class="label" style="font-weight:700;color:${col}">Score: ${score}/${total} (${pct}%)</div><div class="detail"><strong>${msg}</strong></div><div class="detail" style="margin-top:8px;background:#FFF8F3;padding:10px;border-radius:8px;text-align:left;font-size:.85rem"><strong>Recommendations:</strong><br>${tips}</div><div class="detail" style="margin-top:8px;font-size:.7rem;color:#5A6B7A">Fruits/Veg: ${Math.min(vals[0],5)}/5 · Grains: ${Math.min(vals[1],3)}/3 · Protein: ${Math.min(vals[2],2)}/2 · Dairy: ${Math.min(vals[3],2)}/2 · Water: ${Math.min(vals[4],8)}/8</div></div>`);
};

const calcPlate = () => {
  const veg = document.getElementById('pl1')?.value.trim();
  const grains = document.getElementById('pl2')?.value.trim();
  const protein = document.getElementById('pl3')?.value.trim();
  const dairy = document.getElementById('pl4')?.value.trim();
  const filled = [veg,grains,protein,dairy].filter(x=>x).length;
  if (filled === 0) return showError('plR', 'Fill at least one section');
  let score = 0, missing = [];

document.addEventListener('click', e => {
  const trig = e.target.closest('[data-modal]');
  if (trig) { e.preventDefault(); openModal(trig.dataset.modal); return; }
  const toolEl = e.target.closest('[data-tool]');
  if (toolEl) { e.preventDefault(); e.stopPropagation(); openTool(toolEl.dataset.tool); return; }
  const faq = e.target.closest('.faq-q');
  if (faq) { faq.parentElement.classList.toggle('open'); return; }
  const cat = e.target.closest('.cat-btn');
  if (cat) {
    document.querySelectorAll('.cat-btn').forEach(b => { b.classList.remove('active'); b.classList.add('bg-cream','text-charcoal'); });
    cat.classList.add('active'); cat.classList.remove('bg-cream','text-charcoal');
    return;
  }
  const modal = document.getElementById('mainModal');
  if (modal && e.target === modal) closeModal();
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

const handleForm = (form, e) => {
  e.preventDefault();
  const btn = form.querySelector('button[type="submit"]');
  if (!btn) return;
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = 'Sending...';
  setTimeout(() => {
    const success = form.parentElement.querySelector('.form-success');
    if (success) { form.style.display = 'none'; success.classList.remove('hidden'); }
    else { alert('Thank you! We will get back to you soon.'); form.reset(); }
    btn.disabled = false; btn.textContent = orig;
  }, 1200);
};
