<script>
'use strict';

// ============== STATE & UTILS ==============
const app = document.getElementById('app');
let donateAmount = 0;

const escapeHtml = (s) => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

const num = (id) => {
  const el = document.getElementById(id);
  if (!el) return NaN;
  const v = parseFloat(el.value);
  return isNaN(v) ? NaN : v;
};

const showResult = (id, html) => {
  const el = document.getElementById(id);
  if (el) el.innerHTML = html;
};

const showError = (id, msg) => showResult(id, `<div class="tool-error">⚠️ ${escapeHtml(msg)}</div>`);

// ============== ROUTER ==============
const navigate = (page, hash) => {
  if (!pages[page]) page = 'home';
  window.scrollTo(0, 0);
  const mm = document.getElementById('mobile-menu');
  if (mm) mm.classList.add('hidden');
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  const al = document.querySelector(`.nav-link[data-page="${page}"]`);
  if (al) al.classList.add('active');
  app.innerHTML = pages[page];
  if (hash) setTimeout(() => {
    const el = document.querySelector(hash);
    if (el) window.scrollTo({ top: el.offsetTop - 80, behavior: 'smooth' });
  }, 100);
  setTimeout(initCounters, 50);
  try { history.pushState({page}, '', '#' + page); } catch(e) {}
};

window.addEventListener('popstate', e => {
  const page = (e.state && e.state.page) || (location.hash.replace('#','')) || 'home';
  navigate(page);
});

// ============== COUNTERS ==============
const initCounters = () => {
  const counters = document.querySelectorAll('[data-target]');
  if (!counters.length) return;
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting && !e.target.dataset.animated) {
        e.target.dataset.animated = '1';
        const target = parseInt(e.target.dataset.target);
        const suffix = e.target.dataset.suffix || '';
        const duration = 2200;
        const start = performance.now();
        const step = (now) => {
          const p = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          e.target.textContent = Math.floor(eased * target).toLocaleString('en-IN') + suffix;
          if (p < 1) requestAnimationFrame(step);
          else e.target.textContent = target.toLocaleString('en-IN') + suffix;
        };
        requestAnimationFrame(step);
      }
    });
  }, { threshold: 0.3 });
  counters.forEach(c => obs.observe(c));
};

window.addEventListener('scroll', () => {
  const nb = document.getElementById('navbar');
  if (nb) nb.classList.toggle('nav-scrolled', window.scrollY > 50);
}, { passive: true });

// ============== MODAL SYSTEM ==============
const closeModal = () => {
  const modal = document.getElementById('mainModal');
  if (modal) modal.classList.remove('open');
  document.body.style.overflow = '';
};

const openModal = (key) => {
  const content = MODAL_CONTENT[key];
  if (!content) return;
  document.getElementById('modalTitle').innerHTML = content.title;
  document.getElementById('modalBody').innerHTML = content.body;
  const modal = document.getElementById('mainModal');
  const inner = modal.querySelector('.modal');
  inner.classList.remove('modal-wide');
  if (content.wide) inner.classList.add('modal-wide');
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
};

// ============== BLOG ARTICLE MODAL ==============
const openBlog = (id) => {
  const article = BLOG_ARTICLES[id];
  if (!article) return;
  document.getElementById('modalTitle').innerHTML = article.title;
  document.getElementById('modalBody').innerHTML = '<div class="blog-modal-body">' + article.content + '</div>';
  const modal = document.getElementById('mainModal');
  const inner = modal.querySelector('.modal');
  inner.classList.add('modal-wide');
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
};

// ============== TOOLS DATA & OPENING ==============
const openTool = (name) => {
  const t = TOOLS[name];
  if (!t) return;
  document.getElementById('modalTitle').innerHTML = t.title;
  document.getElementById('modalBody').innerHTML = t.html;
  document.getElementById('mainModal').classList.add('open');
  document.body.style.overflow = 'hidden';
};

// Tools definitions
const TOOLS = {
  bmi: { title: '⚖️ BMI Calculator', html: `
    <div style="margin-bottom:16px"><label class="form-label" for="bmiH">Height (cm) <span class="req">*</span></label><input type="number" id="bmiH" value="165" min="50" max="250" class="form-input" placeholder="e.g., 165"></div>
    <div style="margin-bottom:16px"><label class="form-label" for="bmiW">Weight (kg) <span class="req">*</span></label><input type="number" id="bmiW" value="65" min="10" max="300" class="form-input" placeholder="e.g., 65"></div>
    <button class="btn btn-primary w-full" onclick="calcBMI()">Calculate BMI</button>
    <div id="bmiR" style="margin-top:16px"></div>
    <p style="font-size:.75rem;color:#5A6B7A;margin-top:16px;text-align:center">BMI is a screening tool, not a diagnosis.</p>` },
  pregnancy: { title: '🤰 Pregnancy Weight Tracker', html: `
    <div style="margin-bottom:12px"><label class="form-label" for="pW">Pre-pregnancy weight (kg) <span class="req">*</span></label><input type="number" id="pW" value="60" min="30" max="200" class="form-input"></div>
    <div style="margin-bottom:12px"><label class="form-label" for="cW">Current weight (kg) <span class="req">*</span></label><input type="number" id="cW" value="64" min="30" max="200" class="form-input"></div>
    <div style="margin-bottom:16px"><label class="form-label" for="wk">Current week (1-42) <span class="req">*</span></label><input type="number" id="wk" value="20" min="1" max="42" class="form-input"></div>
    <button class="btn btn-primary w-full" onclick="calcPreg()">Track My Weight</button>
    <div id="prR" style="margin-top:16px"></div>` },
  duedate: { title: '📅 Due Date Calculator', html: `
    <div style="margin-bottom:16px"><label class="form-label" for="lmp">First day of last menstrual period <span class="req">*</span></label><input type="date" id="lmp" class="form-input"></div>
    <button class="btn btn-primary w-full" onclick="calcEDD()">Calculate Due Date</button>
    <div id="eddR" style="margin-top:16px"></div>
    <p style="font-size:.75rem;color:#5A6B7A;margin-top:16px;text-align:center">Calculated using Naegele's rule (LMP + 280 days).</p>` },
  water: { title: '💧 Daily Water Intake', html: `
    <div style="margin-bottom:12px"><label class="form-label" for="wW">Weight (kg) <span class="req">*</span></label><input type="number" id="wW" value="60" min="20" max="200" class="form-input"></div>
    <div style="margin-bottom:12px"><label class="form-label" for="wA">Activity level</label><select id="wA" class="form-input"><option value="Sedentary">Sedentary</option><option value="Moderate">Moderate (3-5 days/week)</option><option value="Active">Active (6-7 days/week)</option></select></div>
    <div style="margin-bottom:16px"><label class="form-label" for="wC">Condition</label><select id="wC" class="form-input"><option value="0">Normal</option><option value="300">Pregnant (+300ml)</option><option value="700">Breastfeeding (+700ml)</option></select></div>
    <button class="btn btn-primary w-full" onclick="calcWater()">Calculate Intake</button>
    <div id="wR" style="margin-top:16px"></div>` },
  pcos: { title: '⚕️ PCOS Risk Assessment', html: `
    <p style="font-size:.9rem;color:#5A6B7A;margin-bottom:14px">Answer these 5 questions honestly:</p>
    <div style="margin-bottom:10px"><label class="form-label">1. Irregular periods (less than 8/year)?</label><select id="p1" class="form-input"><option value="0">No</option><option value="1">Yes</option></select></div>
    <div style="margin-bottom:10px"><label class="form-label">2. Excess facial/body hair?</label><select id="p2" class="form-input"><option value="0">No</option><option value="1">Yes</option></select></div>
    <div style="margin-bottom:10px"><label class="form-label">3. Persistent acne?</label><select id="p3" class="form-input"><option value="0">No</option><option value="1">Yes</option></select></div>
    <div style="margin-bottom:10px"><label class="form-label">4. Unexplained weight gain?</label><select id="p4" class="form-input"><option value="0">No</option><option value="1">Yes</option></select></div>
    <div style="margin-bottom:16px"><label class="form-label">5. Family history of PCOS/Diabetes?</label><select id="p5" class="form-input"><option value="0">No</option><option value="1">Yes</option></select></div>
    <button class="btn btn-primary w-full" onclick="calcPCOS()">Assess Risk</button>
    <div id="pR" style="margin-top:16px"></div>
    <p style="font-size:.7rem;color:#5A6B7A;margin-top:12px;text-align:center;font-style:italic">⚠️ This is NOT a medical diagnosis. Please consult a qualified healthcare professional.</p>` },
  growth: { title: '📊 Child Growth Tracker (WHO)', html: `

// ============== CALCULATOR FUNCTIONS ==============
const calcBMI = () => {
  const h = num('bmiH'), w = num('bmiW');
  if (isNaN(h) || h < 50 || h > 250) return showError('bmiR', 'Enter valid height (50-250 cm)');
  if (isNaN(w) || w < 10 || w > 300) return showError('bmiR', 'Enter valid weight (10-300 kg)');
  const bmi = (w / Math.pow(h/100, 2)).toFixed(1);
  let cat='',col='#2BA3A0',advice='';
  if (bmi<18.5){cat='Underweight';col='#2196F3';advice='Increase nutrient-dense foods.';}
  else if (bmi<25){cat='Normal';col='#2BA3A0';advice='Great! Maintain this balance.';}
  else if (bmi<30){cat='Overweight';col='#F57F17';advice='Consider portion control & activity.';}
  else{cat='Obese';col='#E91E63';advice='Consult a healthcare provider.';}
  showResult('bmiR',`<div class="tool-result"><div class="big" style="color:${col}">${bmi}</div><div class="label" style="font-weight:700;color:${col}">${cat}</div><div class="detail">${advice}</div><div class="detail" style="margin-top:6px"><strong>Healthy BMI:</strong> 18.5 – 24.9</div></div>`);
};

const calcEDD = () => {
  const v = document.getElementById('lmp')?.value;
  if (!v) return showError('eddR', 'Please select a date');
  const lmp = new Date(v);
  if (isNaN(lmp.getTime())) return showError('eddR', 'Invalid date');
  const edd = new Date(lmp); edd.setDate(edd.getDate()+280);
  const diff = Math.floor((new Date()-lmp)/(1000*60*60*24));
  if (diff < 0) return showError('eddR', 'LMP cannot be in future');
  const wk = Math.floor(diff/7), days = diff%7;
  const trim = wk<=13?'1st Trimester':wk<=27?'2nd Trimester':'3rd Trimester';
  const daysToEDD = Math.max(0, Math.floor((edd-new Date())/(1000*60*60*24)));
  showResult('eddR',`<div class="tool-result"><div class="big">${edd.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div><div class="label" style="font-weight:700">Estimated Due Date</div><div class="detail"><strong>Current gestational age:</strong> ${wk} weeks, ${days} days (${trim})</div><div class="detail"><strong>${daysToEDD} days</strong> remaining</div></div>`);
};

const calcWater = () => {
  const w = num('wW'), a = document.getElementById('wA')?.value, c = parseInt(document.getElementById('wC')?.value) || 0;
  if (isNaN(w) || w < 20 || w > 200) return showError('wR', 'Enter valid weight (20-200 kg)');
  let ml = w * 35 + c;
  if (a === 'Moderate') ml += 300;
  else if (a === 'Active') ml += 600;
  const glasses = Math.round(ml/250);
  const extra = c ? `${c}ml condition + ` : '';
  showResult('wR',`<div class="tool-result"><div class="big">${glasses}</div><div class="label">glasses (250ml each)</div><div class="detail"><strong>Total:</strong> ${Math.round(ml)} ml per day</div><div class="detail" style="font-size:.75rem"><em>${extra}35ml per kg base</em></div></div>`);
};

const calcPCOS = () => {
  let s = 0;
  for (let i = 1; i <= 5; i++) {
    const el = document.getElementById('p'+i);
    if (el) s += parseInt(el.value) || 0;
  }
  let r='',col='#2BA3A0',rec='';
  if (s<=1){r='Low Risk';col='#2BA3A0';rec='Maintain healthy lifestyle.';}
  else if (s<=3){r='Moderate Risk';col='#F57F17';rec='Consider clinical evaluation.';}
  else{r='High Risk';col='#E91E63';rec='Consult a gynaecologist for diagnosis.';}
  showResult('pR',`<div class="tool-result"><div class="big" style="color:${col}">${s}/5</div><div class="label" style="font-weight:700;color:${col}">${r}</div><div class="detail" style="margin-top:10px;background:#FFF8F3;padding:10px;border-radius:8px"><strong>${rec}</strong></div></div>`);
};

const calcPreg = () => {
  const pre = num('pW'), cur = num('cW'), wk = num('wk');
  if (isNaN(pre) || pre < 30 || pre > 200) return showError('prR', 'Enter valid pre-pregnancy weight');
  if (isNaN(cur) || cur < 30 || cur > 200) return showError('prR', 'Enter valid current weight');
  if (isNaN(wk) || wk < 1 || wk > 42) return showError('prR', 'Enter valid week (1-42)');
  const gain = cur - pre;
  const lowerExpected = wk <= 13 ? 0.5 : 2 + (wk - 14) * 0.4;
  const upperExpected = wk <= 13 ? 2 : 2 + (wk - 14) * 0.5;
  let status='',col='#2BA3A0',msg='';
  if (gain < lowerExpected - 1) { status='Below Range';col='#2196F3';msg='⚠️ Focus on nutrient-dense foods.'; }
  else if (gain > upperExpected + 2) { status='Above Range';col='#F57F17';msg='⚠️ Consult your doctor.'; }
  else { status='On Track';col='#2BA3A0';msg='✅ Healthy weight progression!'; }
  showResult('prR',`<div class="tool-result"><div class="big" style="color:${col}">+${gain.toFixed(1)} kg</div><div class="label" style="font-weight:700;color:${col}">${status}</div><div class="detail"><strong>Healthy range at week ${wk}:</strong> ${lowerExpected.toFixed(1)}-${upperExpected.toFixed(1)} kg</div><div class="detail" style="margin-top:6px">${msg}</div><div class="detail" style="font-size:.75rem"><strong>Total recommended:</strong> 11.5-16 kg (normal BMI)</div></div>`);
};

const calcGrowth = () => {
  const age = num('gA'), gender = document.getElementById('gG')?.value, weight = num('gW'), height = num('gH');
  if (isNaN(age) || age < 0 || age > 60) return showError('gR', 'Enter age (0-60 months)');
  if (isNaN(weight) || weight < 1 || weight > 50) return showError('gR', 'Enter valid weight (1-50 kg)');
  if (isNaN(height) || height < 40 || height > 150) return showError('gR', 'Enter valid height (40-150 cm)');
  const WHO_W = {boy:{0:3.3,6:7.9,12:9.6,24:12.2,36:14.3,48:16.3,60:18.3},girl:{0:3.2,6:7.3,12:9.0,24:11.5,36:13.5,48:15.7,60:18.2}};
  const WHO_H = {boy:{0:49.9,6:67.6,12:75.7,24:87.8,36:96.1,48:103.3,60:110.0},girl:{0:49.1,6:65.7,12:74.0,24:86.4,36:95.1,48:102.7,60:109.4}};
  const interp = (t, target) => {
    const ages = Object.keys(t).map(Number).sort((a,b)=>a-b);
    if (target <= ages[0]) return t[ages[0]];
    if (target >= ages[ages.length-1]) return t[ages[ages.length-1]];
    for (let i=0;i<ages.length-1;i++) {
      if (target >= ages[i] && target <= ages[i+1]) {
        const r = (target-ages[i])/(ages[i+1]-ages[i]);
        return t[ages[i]] + r*(t[ages[i+1]]-t[ages[i]]);
      }
    }
    return t[ages[0]];
  };
  const wMed = interp(WHO_W[gender], age);
  const wRatio = weight/wMed;
  let status='',col='#2BA3A0',advice='✅ Weight is within healthy range for age.';
  if (wRatio<0.7) {status='Severely Underweight';col='#E91E63';advice='⚠️ Consult pediatrician immediately.';}
  else if (wRatio<0.85) {status='Underweight';col='#F57F17';advice='⚠️ Nutritional intervention recommended.';}
  else if (wRatio>1.2) {status='Possible Overweight';col='#F57F17';advice='⚠️ Consult doctor for assessment.';}
  showResult('gR',`<div class="tool-result"><div class="big" style="color:${col}">${weight} kg</div><div class="label" style="font-weight:700;color:${col}">${status}</div><div class="detail"><strong>WHO Median:</strong> ${wMed.toFixed(1)} kg at ${age} months</div><div class="detail"><strong>Height:</strong> ${height} cm</div><div class="detail" style="margin-top:8px;background:#FFF8F3;padding:10px;border-radius:8px;font-size:.85rem">${advice}</div></div>`);
};

const calcNutr = () => {
  const vals = ['n1','n2','n3','n4','n5'].map(id => num(id));
  if (vals.some(isNaN)) return showError('nR', 'Fill all fields with valid numbers');
  const score = Math.min(vals[0],5) + Math.min(vals[1],3) + Math.min(vals[2],2) + Math.min(vals[3],2) + Math.min(vals[4],8);
  const total = 20;
  const pct = Math.round((score/total)*100);
  let grade='',col='#2BA3A0',msg='',tips='';
  if (pct>=85) {grade='Excellent';col='#2BA3A0';msg='Outstanding!';tips='Maintain this pattern.';}
  else if (pct>=65) {grade='Good';col='#2196F3';msg='Good habits!';tips='Add 1-2 more servings of fruits/vegetables.';}
  else if (pct>=45) {grade='Needs Improvement';col='#F57F17';msg='Several areas need attention.';tips='Focus on more vegetables and water.';}
  else {grade='Poor';col='#E91E63';msg='Major improvement needed.';tips='Consult a nutritionist.';}
  showResult('nR',`<div class="tool-result"><div class="big" style="color:${col}">${grade}</div><div class="label" style="font-weight:700;color:${col}">Score: ${score}/${total} (${pct}%)</div><div class="detail"><strong>${msg}</strong></div><div class="detail" style="margin-top:8px;background:#FFF8F3;padding:10px;border-radius:8px;text-align:left;font-size:.85rem"><strong>Recommendations:</strong><br>${tips}</div><div class="detail" style="margin-top:8px;font-size:.7rem;color:#5A6B7A">Fruits/Veg: ${Math.min(vals[0],5)}/5 · Grains: ${Math.min(vals[1],3)}/3 · Protein: ${Math.min(vals[2],2)}/2 · Dairy: ${Math.min(vals[3],2)}/2 · Water: ${Math.min(vals[4],8)}/8</div></div>`);
};

const calcPlate = () => {
  const veg = document.getElementById('pl1')?.value.trim();
  const grains = document.getElementById('pl2')?.value.trim();
  const protein = document.getElementById('pl3')?.value.trim();
  const dairy = document.getElementById('pl4')?.value.trim();
  const filled = [veg,grains,protein,dairy].filter(x=>x).length;
  if (filled === 0) return showError('plR', 'Fill at least one section');
  let score = 0, missing = [];
  if (veg) score+=30; else missing.push('Vegetables (½ plate)');
  if (grains) score+=25; else missing.push('Whole grains (¼ plate)');
  if (protein) score+=25; else missing.push('Protein (¼ plate)');
  if (dairy) score+=20; else missing.push('Dairy');
  let grade='',col='#2BA3A0';
  if (score>=90) {grade='Excellent Plate';col='#2BA3A0';}
  else if (score>=70) {grade='Balanced Plate';col='#2196F3';}
  else if (score>=50) {grade='Needs Improvement';col='#F57F17';}
  else {grade='Incomplete Plate';col='#E91E63';}
  const sum = [];
  if (veg) sum.push(`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #E5ECEC"><span>🥗 <strong>Vegetables:</strong></span><span>${escapeHtml(veg)}</span></div>`);
  if (grains) sum.push(`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #E5ECEC"><span>🌾 <strong>Whole Grains:</strong></span><span>${escapeHtml(grains)}</span></div>`);
  if (protein) sum.push(`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #E5ECEC"><span>🍗 <strong>Protein:</strong></span><span>${escapeHtml(protein)}</span></div>`);
  if (dairy) sum.push(`<div style="display:flex;justify-content:space-between;padding:6px 0"><span>🥛 <strong>Dairy:</strong></span><span>${escapeHtml(dairy)}</span></div>`);
  showResult('plR',`<div class="tool-result"><div class="big" style="color:${col}">${grade}</div><div class="label" style="font-weight:700;color:${col}">Score: ${score}/100</div><div class="detail" style="margin-top:12px;text-align:left">${sum.join('')}</div>${missing.length>0?`<div class="tool-success-detail" style="margin-top:10px"><strong>Add for better balance:</strong><br>${missing.join('<br>')}</div>`:'<div class="tool-success-detail" style="margin-top:10px"><strong>Perfect!</strong> Plate follows the ½-¼-¼ model.</div>'}</div>`);
};
